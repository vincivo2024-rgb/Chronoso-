<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHRONOS | World Simulation</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    overflow: hidden;
    background: #111820;
    font-family: Arial, sans-serif;
    color: white;
}

#ui {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 20px;
    background: rgba(12,18,24,0.82);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    width: 280px;
}

h1 {
    font-size: 26px;
    letter-spacing: 5px;
}

.subtitle {
    color: #91a5b5;
    font-size: 11px;
    margin-top: 5px;
    letter-spacing: 2px;
}

hr {
    border: 0;
    border-top: 1px solid #34414d;
    margin: 15px 0;
}

.stat {
    display: flex;
    justify-content: space-between;
    margin: 9px 0;
    font-size: 13px;
}

.stat span:last-child {
    color: #a8d6a0;
}

button {
    background: #273745;
    color: white;
    border: 1px solid #526575;
    padding: 9px 13px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 6px;
}

button:hover {
    background: #40596d;
}

#controls {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
}

#help {
    position: absolute;
    bottom: 20px;
    right: 20px;
    color: #9eabb6;
    font-size: 12px;
}

</style>
</head>

<body>

<div id="ui">
    <h1>CHRONOS</h1>
    <div class="subtitle">PLANETARY SIMULATION</div>

    <hr>

    <div class="stat">
        <span>Year</span>
        <span id="year">0001</span>
    </div>

    <div class="stat">
        <span>Population</span>
        <span id="population">12</span>
    </div>

    <div class="stat">
        <span>Animals</span>
        <span id="animals">48</span>
    </div>

    <div class="stat">
        <span>Temperature</span>
        <span>18°C</span>
    </div>

    <div class="stat">
        <span>Biome</span>
        <span>Temperate</span>
    </div>

    <hr>

    <button onclick="toggleSimulation()" id="pauseButton">
        Pause Simulation
    </button>

    <button onclick="resetSimulation()">
        Reset World
    </button>
</div>

<div id="controls">
    <button onclick="setSpeed(1)">1×</button>
    <button onclick="setSpeed(5)">5×</button>
    <button onclick="setSpeed(20)">20×</button>
    <button onclick="setSpeed(100)">100×</button>
</div>

<div id="help">
    Drag = rotate · Scroll = zoom
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.js",
    "three/addons/": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x91b8d2);
scene.fog = new THREE.Fog(0x91b8d2, 100, 240);

const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    500
);

camera.position.set(65, 55, 65);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setAnimationLoop(animate);

document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);
controls.maxPolarAngle = Math.PI / 2.05;

// LIGHTING

const sunlight = new THREE.DirectionalLight(0xffffff, 2.5);
sunlight.position.set(60, 90, 40);
sunlight.castShadow = true;
sunlight.shadow.mapSize.width = 2048;
sunlight.shadow.mapSize.height = 2048;
scene.add(sunlight);

scene.add(new THREE.HemisphereLight(0xc8e0ff, 0x52653a, 1.5));

// TERRAIN

const SIZE = 120;

function terrainHeight(x, z) {
    return (
        Math.sin(x * 0.08) * 2.5 +
        Math.cos(z * 0.07) * 3 +
        Math.sin((x + z) * 0.05) * 2 +
        Math.cos(x * 0.12 + z * 0.09) * 1.5
    );
}

const terrainGeometry = new THREE.PlaneGeometry(
    SIZE,
    SIZE,
    120,
    120
);

terrainGeometry.rotateX(-Math.PI / 2);

const positions = terrainGeometry.attributes.position;

for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const z = positions.getZ(i);

    positions.setY(i, terrainHeight(x, z));
}

terrainGeometry.computeVertexNormals();

const terrainMaterial = new THREE.MeshStandardMaterial({
    color: 0x62884c,
    roughness: 1
});

const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
terrain.receiveShadow = true;
terrain.castShadow = true;
scene.add(terrain);

// WATER

const water = new THREE.Mesh(
    new THREE.CircleGeometry(19, 64),
    new THREE.MeshStandardMaterial({
        color: 0x398bb0,
        roughness: 0.25,
        metalness: 0.1
    })
);

water.rotation.x = -Math.PI / 2;
water.position.set(-23, 0.1, 10);
scene.add(water);

// TREES

const treeGroup = new THREE.Group();
scene.add(treeGroup);

function createTree(x, z, scale = 1) {

    const y = terrainHeight(x, z);

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.25 * scale,
            0.4 * scale,
            3 * scale,
            7
        ),
        new THREE.MeshStandardMaterial({
            color: 0x654329
        })
    );

    trunk.position.set(x, y + 1.5 * scale, z);
    trunk.castShadow = true;

    const leaves = new THREE.Mesh(
        new THREE.ConeGeometry(2.3 * scale, 6 * scale, 8),
        new THREE.MeshStandardMaterial({
            color: Math.random() > 0.5 ? 0x315f36 : 0x456f3e
        })
    );

    leaves.position.set(x, y + 5 * scale, z);
    leaves.castShadow = true;

    treeGroup.add(trunk);
    treeGroup.add(leaves);
}

// Random forest generation

for (let i = 0; i < 420; i++) {

    const x = (Math.random() - 0.5) * SIZE;
    const z = (Math.random() - 0.5) * SIZE;

    // Avoid village and lake
    if (Math.hypot(x - 10, z - 10) < 15) continue;
    if (Math.hypot(x + 23, z - 10) < 23) continue;

    createTree(x, z, 0.7 + Math.random() * 1.1);
}

// VILLAGE

const village = new THREE.Group();
scene.add(village);

function createHouse(x, z) {

    const y = terrainHeight(x, z);

    const house = new THREE.Group();

    const base = new THREE.Mesh(
        new THREE.BoxGeometry(5, 4, 5),
        new THREE.MeshStandardMaterial({
            color: 0xc9ad83
        })
    );

    base.position.y = 2;
    base.castShadow = true;
    base.receiveShadow = true;
    house.add(base);

    const roof = new THREE.Mesh(
        new THREE.ConeGeometry(4.2, 3, 4),
        new THREE.MeshStandardMaterial({
            color: 0x713d2e
        })
    );

    roof.rotation.y = Math.PI / 4;
    roof.position.y = 5.5;
    roof.castShadow = true;
    house.add(roof);

    const door = new THREE.Mesh(
        new THREE.BoxGeometry(1, 2.2, 0.15),
        new THREE.MeshStandardMaterial({
            color: 0x493323
        })
    );

    door.position.set(0, 1.1, 2.55);
    house.add(door);

    house.position.set(x, y, z);
    village.add(house);
}

createHouse(5, 5);
createHouse(14, 5);
createHouse(5, 15);
createHouse(16, 16);
createHouse(-1, 12);

// VILLAGE PATHS

function createPath(x, z, width, length) {

    const path = new THREE.Mesh(
        new THREE.BoxGeometry(width, 0.15, length),
        new THREE.MeshStandardMaterial({
            color: 0xb6a17c
        })
    );

    path.position.set(x, terrainHeight(x,z) + 0.1, z);
    scene.add(path);
}

createPath(10, 10, 3, 25);
createPath(10, 10, 25, 3);

// ANIMALS

const animalGroup = new THREE.Group();
scene.add(animalGroup);

const animals = [];

function createAnimal(x, z) {

    const animal = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.8, 12, 8),
        new THREE.MeshStandardMaterial({
            color: 0x8c7961
        })
    );

    body.scale.set(1.5, 0.8, 1);
    body.position.y = 1;
    animal.add(body);

    const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 10, 8),
        new THREE.MeshStandardMaterial({
            color: 0x9d8870
        })
    );

    head.position.set(1, 1.3, 0);
    animal.add(head);

    const legs = [];

    for (let i = 0; i < 4; i++) {

        const leg = new THREE.Mesh(
            new THREE.CylinderGeometry(0.12, 0.12, 0.8),
            new THREE.MeshStandardMaterial({
                color: 0x574535
            })
        );

        leg.position.set(
            i < 2 ? 0.6 : -0.6,
            0.4,
            i % 2 === 0 ? 0.4 : -0.4
        );

        animal.add(leg);
        legs.push(leg);
    }

    animal.position.set(x, terrainHeight(x,z), z);

    animalGroup.add(animal);

    animals.push({
        mesh: animal,
        legs,
        direction: Math.random() * Math.PI * 2,
        speed: 0.01 + Math.random() * 0.025
    });
}

for (let i = 0; i < 48; i++) {

    let x = (Math.random() - 0.5) * 90;
    let z = (Math.random() - 0.5) * 90;

    if (Math.hypot(x + 23, z - 10) < 25) continue;

    createAnimal(x, z);
}

// SIMULATION

let running = true;
let speed = 1;
let year = 1;
let elapsed = 0;

function toggleSimulation() {

    running = !running;

    document.getElementById("pauseButton").innerText =
        running ? "Pause Simulation" : "Resume Simulation";
}

window.toggleSimulation = toggleSimulation;

window.setSpeed = function(s) {
    speed = s;
};

window.resetSimulation = function() {

    year = 1;
    elapsed = 0;

    animals.forEach(a => {
        a.mesh.position.x = (Math.random() - 0.5) * 90;
        a.mesh.position.z = (Math.random() - 0.5) * 90;
    });
};

function updateAnimals() {

    animals.forEach(a => {

        a.direction += (Math.random() - 0.5) * 0.02;

        a.mesh.position.x += Math.cos(a.direction) * a.speed * speed;
        a.mesh.position.z += Math.sin(a.direction) * a.speed * speed;

        // Boundaries
        if (Math.abs(a.mesh.position.x) > 55) a.direction += Math.PI;
        if (Math.abs(a.mesh.position.z) > 55) a.direction += Math.PI;

        a.mesh.position.y = terrainHeight(
            a.mesh.position.x,
            a.mesh.position.z
        );

        a.mesh.rotation.y = -a.direction;

        a.legs.forEach((leg, i) => {
            leg.rotation.x = Math.sin(elapsed * 5 + i) * 0.3;
        });
    });
}

// DAY / NIGHT

function updateDayNight() {

    const cycle = elapsed * 0.04;

    sunlight.position.x = Math.cos(cycle) * 80;
    sunlight.position.y = Math.sin(cycle) * 80;

    sunlight.intensity = Math.max(
        0.25,
        Math.sin(cycle) * 2 + 0.5
    );
}

// ANIMATION

function animate() {

    controls.update();

    if (running) {

        elapsed += 0.01 * speed;

        updateAnimals();
        updateDayNight();

        if (elapsed > 30) {
            elapsed = 0;
            year++;

            document.getElementById("year").innerText =
                String(year).padStart(4, "0");
        }
    }

    renderer.render(scene, camera);
}

// RESPONSIVE

window.addEventListener("resize", () => {

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
