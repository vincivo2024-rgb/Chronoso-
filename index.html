<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronos 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#07101b;color:white;font-family:Arial}
canvas{display:block}
#panel{position:absolute;top:12px;left:12px;width:250px;max-height:90vh;overflow:auto;padding:14px;background:rgba(8,16,27,.9);border:1px solid #40566b;border-radius:12px}
h1{margin:0;letter-spacing:5px}
.sub{font-size:10px;color:#91afc6;letter-spacing:2px}
hr{border:0;border-top:1px solid #34485a;margin:12px 0}
.row{display:flex;justify-content:space-between;margin:7px 0;font-size:13px}
.row span:last-child{color:#9fe0ad}
button,select{color:white;background:#203548;border:1px solid #526c82;border-radius:6px;padding:8px;font-size:12px}
button{cursor:pointer}
button:hover{background:#38566e}
.group{display:flex;gap:5px;margin-top:7px}
.group button{flex:1}
select{width:100%;margin-top:6px}
#bottom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;flex-wrap:wrap;justify-content:center;width:95%}
#bottom button{background:rgba(10,20,33,.9)}
#notice{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:13px 20px;background:rgba(5,12,22,.95);border:1px solid #60758a;border-radius:9px;display:none;pointer-events:none}
#hint{position:absolute;bottom:12px;right:12px;font-size:10px;color:#a9bdcc}
@media(max-width:500px){#panel{width:225px;padding:11px}.row{font-size:12px}}
</style>
</head>
<body>

<div id="panel">
<h1>CHRONOS</h1>
<div class="sub">WORLD SIMULATOR</div>
<hr>
<div class="row"><span>Planet</span><span id="world">Earth</span></div>
<div class="row"><span>Jahr</span><span id="year">2026</span></div>
<div class="row"><span>Population</span><span id="pop">24</span></div>
<div class="row"><span>Kingdom</span><span id="state">Averon</span></div>
<div class="row"><span>Technologie</span><span id="tech">1</span></div>
<div class="row"><span>Gebäude</span><span id="buildings">5</span></div>
<div class="row"><span>Armee</span><span id="army">0</span></div>
<div class="row"><span>Status</span><span id="status">Frieden</span></div>
<hr>
Zeit:
<div class="group">
<button onclick="advanceYears(1)">+1</button>
<button onclick="advanceYears(10)">+10</button>
<button onclick="advanceYears(100)">+100</button>
</div>
<div class="group">
<button onclick="advanceYears(1000)">+1.000</button>
<button onclick="advanceYears(10000)">+10.000</button>
</div>
<hr>
<div class="group">
<button onclick="buildHouse()">🏗 Bauen</button>
<button onclick="declareWar()">⚔ Krieg</button>
</div>
<div class="group">
<button onclick="showSurface()">🌍 Oberfläche</button>
<button onclick="showSpace()">🌌 Weltraum</button>
</div>
<hr>
Planet:
<select id="planetSelect" onchange="changePlanet(this.value)">
<option value="Earth">Erde</option>
<option value="Mars">Mars</option>
<option value="Moon">Mond</option>
<option value="Venus">Venus</option>
<option value="Jupiter">Jupiter</option>
<option value="Saturn">Saturn</option>
</select>
<div style="font-size:10px;color:#839bad;margin-top:10px">
Kamera drehen und zoomen. Auf Planeten klicken, um sie auszuwählen.
</div>
</div>

<div id="bottom">
<button onclick="advanceYears(1)">+1 Jahr</button>
<button onclick="advanceYears(100)">+100 Jahre</button>
<button onclick="advanceYears(1000)">+1.000 Jahre</button>
<button onclick="showSpace()">Sonnensystem</button>
</div>
<div id="hint">Drehen · Zoomen · Erkunden</div>
<div id="notice"></div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.js",
  "three/addons/":"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b9d7);
scene.fog=new THREE.Fog(0x91b9d7,140,300);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,2000);
camera.position.set(30,26,38);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.maxPolarAngle=Math.PI*.49;
controls.minDistance=2;
controls.maxDistance=300;
controls.target.set(0,0,0);

scene.add(new THREE.HemisphereLight(0xd5eaff,0x40502c,2));

const sunlight=new THREE.DirectionalLight(0xffffff,2.7);
sunlight.position.set(60,100,40);
sunlight.castShadow=true;
sunlight.shadow.mapSize.set(2048,2048);
scene.add(sunlight);

const surface=new THREE.Group();
const system=new THREE.Group();
scene.add(surface,system);

let currentPlanet='Earth';
let view='surface';
let year=2026;
let population=24;
let tech=1;
let buildingCount=0;
let armyCount=0;
let atWar=false;
let kingdom='Averon';
let kingdomColor=0x3c9759;
let people=[];
let buildings=[];
let soldiers=[];
let planets={};
let time=0;

const A=['Aver','Val','Eld','Thar','Nor','Cal','Mer','Sol','Dra','Vel','Ar','Kyr','Or','Zan','Lun','Rav','Tor','Bel','Is','Mor','Kael','Vey'];
const B=['ia','on','ara','heim','oria','os','and','eria','dor','wyn','alis','oth','en','ria','gard','ar','eth','ium','ara','is'];
function nameGen(){return A[Math.floor(Math.random()*A.length)]+B[Math.floor(Math.random()*B.length)]}
function newKingdom(){kingdom=nameGen();kingdomColor=Math.random()*0xffffff}

const el=id=>document.getElementById(id);
function ui(){
 el('world').textContent=currentPlanet;
 el('year').textContent=year.toLocaleString();
 el('pop').textContent=Math.floor(population).toLocaleString();
 el('state').textContent=kingdom;
 el('tech').textContent=tech;
 el('buildings').textContent=buildingCount;
 el('army').textContent=armyCount;
 el('status').textContent=atWar?'Krieg':'Frieden';
}
function notice(t){
 const n=el('notice');n.textContent=t;n.style.display='block';
 setTimeout(()=>n.style.display='none',2200);
}
function clear(g){
 while(g.children.length){
  const o=g.children[0];g.remove(o);
  o.traverse?.(c=>{
   if(c.geometry)c.geometry.dispose();
   if(c.material){
    if(Array.isArray(c.material))c.material.forEach(m=>m.dispose());
    else c.material.dispose();
   }
  });
 }
}
function h(x,z){
 return Math.sin(x*.06)*1.7+Math.cos(z*.07)*2+
 Math.sin((x+z)*.045)*1.5+Math.cos(x*.11-z*.07)*.5;
}

// LANDSCAPE
function ground(colorMode='earth'){
 const g=new THREE.PlaneGeometry(150,150,120,120);
 g.rotateX(-Math.PI/2);
 const p=g.attributes.position,colors=[];
 for(let i=0;i<p.count;i++){
  const x=p.getX(i),z=p.getZ(i),y=h(x,z);
  p.setY(i,y);
  let c;
  if(colorMode==='earth')c=new THREE.Color(y>3?0x667c60:y>0?0x4f7d43:0x719550);
  else if(colorMode==='mars')c=new THREE.Color(0x9d4c32);
  else if(colorMode==='moon')c=new THREE.Color(0x727780);
  else c=new THREE.Color(0x514c85);
  colors.push(c.r,c.g,c.b);
 }
 g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
 g.computeVertexNormals();
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));
 m.receiveShadow=true;surface.add(m);
}

function lake(){
 const m=new THREE.Mesh(new THREE.CircleGeometry(15,60),new THREE.MeshStandardMaterial({color:0x287eaa,roughness:.2}));
 m.rotation.x=-Math.PI/2;m.position.set(-28,.15,15);surface.add(m);
}

function tree(x,z,s=1){
 const y=h(x,z);
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.28*s,2*s,7),new THREE.MeshStandardMaterial({color:0x674329}));
 trunk.position.set(x,y+s,z);trunk.castShadow=true;
 const crown=new THREE.Mesh(new THREE.ConeGeometry(1.6*s,3.6*s,8),new THREE.MeshStandardMaterial({color:Math.random()>.5?0x2d6739:0x477d42}));
 crown.position.set(x,y+3*s,z);crown.castShadow=true;
 surface.add(trunk,crown);
}
function forest(){
 for(let i=0;i<220;i++){
  const x=(Math.random()-.5)*140,z=(Math.random()-.5)*140;
  if(Math.hypot(x,z)<24||Math.hypot(x+28,z-15)<18)continue;
  tree(x,z,.65+Math.random()*.8);
 }
}
function road(x,z,w,l){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,.1,l),new THREE.MeshStandardMaterial({color:0xb4a084}));
 m.position.set(x,h(x,z)+.08,z);surface.add(m);
}

// BUILDINGS
function house(x,z){
 const g=new THREE.Group();
 const base=new THREE.Mesh(new THREE.BoxGeometry(4,3,4),new THREE.MeshStandardMaterial({color:0xcab28b}));
 base.position.y=1.5;base.castShadow=true;g.add(base);
 const roof=new THREE.Mesh(new THREE.ConeGeometry(3.3,2.3,4),new THREE.MeshStandardMaterial({color:0x793e31}));
 roof.rotation.y=Math.PI/4;roof.position.y=4;roof.castShadow=true;g.add(roof);
 const door=new THREE.Mesh(new THREE.BoxGeometry(.8,1.7,.12),new THREE.MeshStandardMaterial({color:0x48301f}));
 door.position.set(0,.85,2.05);g.add(door);
 const wm=new THREE.MeshStandardMaterial({color:0x83bfd6});
 for(const xoff of [-1.1,1.1]){
  const w=new THREE.Mesh(new THREE.BoxGeometry(.6,.6,.1),wm);
  w.position.set(xoff,1.8,2.05);g.add(w);
 }
 g.position.set(x,h(x,z),z);surface.add(g);buildings.push(g);buildingCount++;
}
function tower(x,z){
 const g=new THREE.Group();
 const b=new THREE.Mesh(new THREE.BoxGeometry(5,13,5),new THREE.MeshStandardMaterial({color:0x8b969f}));
 b.position.y=6.5;b.castShadow=true;g.add(b);
 const r=new THREE.Mesh(new THREE.ConeGeometry(3.5,4,4),new THREE.MeshStandardMaterial({color:0x43596c}));
 r.position.y=15;g.add(r);
 g.position.set(x,h(x,z),z);surface.add(g);buildings.push(g);buildingCount++;
}

// PEOPLE
function person(x,z,color=kingdomColor){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CylinderGeometry(.2,.28,.8,6),new THREE.MeshStandardMaterial({color}));
 body.position.y=.85;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.2,8,8),new THREE.MeshStandardMaterial({color:0xd6a47f}));
 head.position.y=1.45;g.add(head);
 const legmat=new THREE.MeshStandardMaterial({color:0x30333b});
 for(const dx of [-.12,.12]){
  const leg=new THREE.Mesh(new THREE.BoxGeometry(.12,.5,.12),legmat);
  leg.position.set(dx,.25,0);g.add(leg);
 }
 g.position.set(x,h(x,z),z);surface.add(g);
 people.push({mesh:g,dx:(Math.random()-.5)*.025,dz:(Math.random()-.5)*.025});
}
function addPeople(n){
 for(let i=0;i<n;i++)person((Math.random()-.5)*25,(Math.random()-.5)*25);
}

// SOLDIERS
function soldier(x,z,color,enemy=false){
 const g=new THREE.Group();
 const b=new THREE.Mesh(new THREE.CylinderGeometry(.27,.36,1,6),new THREE.MeshStandardMaterial({color}));
 b.position.y=1;g.add(b);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.22,8,8),new THREE.MeshStandardMaterial({color:0xd3a17a}));
 head.position.y=1.65;g.add(head);
 const spear=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,1.6,5),new THREE.MeshStandardMaterial({color:0xbac5d0}));
 spear.position.set(.4,1.5,0);g.add(spear);
 g.position.set(x,h(x,z),z);surface.add(g);
 soldiers.push({mesh:g,dx:(Math.random()-.5)*.08,dz:(Math.random()-.5)*.08,enemy});
}

// PLANET SURFACE
function resetSurface(){
 clear(surface);
 people=[];buildings=[];soldiers=[];
 buildingCount=0;armyCount=0;atWar=false;
 if(currentPlanet==='Earth'){
  scene.background=new THREE.Color(0x91b9d7);
  scene.fog=new THREE.Fog(0x91b9d7,140,300);
  ground('earth');lake();forest();
 }else if(currentPlanet==='Mars'){
  scene.background=new THREE.Color(0xb66b4a);
  scene.fog=new THREE.Fog(0xb66b4a,140,300);
  ground('mars');
 }else if(currentPlanet==='Moon'){
  scene.background=new THREE.Color(0x151a24);scene.fog=null;ground('moon');
 }else{
  scene.background=new THREE.Color(0x171f30);scene.fog=null;ground('alien');
 }
 road(0,0,2.5,30);road(0,0,30,2.5);
 house(-5,-5);house(5,-5);house(-5,5);house(5,5);house(0,12);
 addPeople(24);
 surface.visible=true;system.visible=false;
 controls.target.set(0,0,0);
 camera.position.set(30,26,38);
 ui();
}

// SPACE
function makePlanet(name,r,color,x){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,48,32),new THREE.MeshStandardMaterial({color,roughness:.8}));
 m.position.set(x,0,0);m.userData.planet=name;system.add(m);planets[name]=m;
}
function earthPlanet(){
 const g=new THREE.SphereGeometry(3.5,64,48),colors=[];
 const p=g.attributes.position;
 for(let i=0;i<p.count;i++){
  const v=new THREE.Vector3(p.getX(i),p.getY(i),p.getZ(i)).normalize();
  const lat=Math.asin(v.y),lon=Math.atan2(v.z,v.x);
  const n=Math.sin(lon*3+Math.cos(lat*4))+Math.cos(lon*4-lat*2)+Math.sin(lat*5+lon*2);
  let c=n>.4?new THREE.Color(0x438b50):new THREE.Color(0x2472b1);
  if(Math.abs(lat)>1.25)c=new THREE.Color(0xe1e7e8);
  colors.push(c.r,c.g,c.b);
 }
 g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.9}));
 m.position.set(25,0,0);system.add(m);planets.Earth=m;m.userData.planet='Earth';
}
function makeSystem(){
 clear(system);planets={};
 const sun=new THREE.Mesh(new THREE.SphereGeometry(7,32,32),new THREE.MeshBasicMaterial({color:0xffd56a}));
 system.add(sun);
 earthPlanet();
 makePlanet('Mars',2,0xb75a3a,43);
 makePlanet('Moon',1,0x969696,16);
 makePlanet('Jupiter',5,0xc5a47d,72);
 makePlanet('Saturn',4,0xd5c49b,105);
 makePlanet('Venus',2.8,0xc9a46a,12);
 makePlanet('Mercury',1.4,0x8d8580,9);
 const ring=new THREE.Mesh(new THREE.RingGeometry(5,8,64),new THREE.MeshBasicMaterial({color:0xc6b28e,side:THREE.DoubleSide,transparent:true,opacity:.65}));
 ring.rotation.x=Math.PI/2;ring.position.copy(planets.Saturn.position);system.add(ring);
 const geo=new THREE.BufferGeometry(),pts=[];
 for(let i=0;i<1600;i++)pts.push((Math.random()-.5)*800,(Math.random()-.5)*800,(Math.random()-.5)*800);
 geo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
 system.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size:.8})));
}

// VIEWS
function showSpace(){
 view='space';surface.visible=false;system.visible=true;
 scene.background=new THREE.Color(0x02040a);scene.fog=null;
 camera.position.set(0,60,140);controls.target.set(35,0,0);
 controls.maxPolarAngle=Math.PI;controls.maxDistance=600;
 notice('Sonnensystem');
}
function showSurface(){
 view='surface';surface.visible=true;system.visible=false;
 camera.position.set(30,26,38);controls.target.set(0,0,0);
 controls.maxPolarAngle=Math.PI*.49;controls.maxDistance=180;
 notice(currentPlanet+' Oberfläche');
}
function changePlanet(name){
 currentPlanet=name;
 el('planetSelect').value=name;
 kingdom=name==='Earth'?'Averon':name==='Mars'?'Mar'+nameGen():name==='Moon'?'Lunar'+nameGen():name+'ian'+nameGen();
 kingdomColor=name==='Mars'?0xc75b3b:Math.random()*0xffffff;
 resetSurface();showSurface();notice(name+' ausgewählt');
}

// SIMULATION
function advanceYears(n){
 year+=n;
 population+=Math.max(1,Math.floor(population*(.012+tech*.001)*Math.min(n,100)));
 if(year>=2035)tech=Math.max(tech,2);
 if(year>=2080)tech=Math.max(tech,3);
 if(year>=2150)tech=Math.max(tech,4);
 if(year>=2300)tech=Math.max(tech,5);
 if(year>=2600)tech=Math.max(tech,6);
 if(year>=3000)tech=Math.max(tech,7);
 if(year>=5000)tech=Math.max(tech,8);
 if(year>=10000)tech=Math.max(tech,9);
 if(year>=50000)tech=Math.max(tech,10);
 for(let i=0;i<Math.min(30,Math.floor(n/5)+1);i++)house((Math.random()-.5)*55,(Math.random()-.5)*55);
 addPeople(Math.min(60,Math.floor(n/10)+2));
 if(tech>=4&&buildingCount<100&&Math.random()>.5)tower((Math.random()-.5)*50,(Math.random()-.5)*50);
 if(n>=100&&Math.random()>.6){newKingdom();notice('Neues Königreich: '+kingdom);}
 if(tech>=7&&currentPlanet==='Earth'&&year>2500)notice('Raumfahrt und Marskolonisierung beginnen!');
 if(atWar&&n>=10&&Math.random()>.4){
  atWar=false;armyCount=0;
  soldiers.forEach(s=>surface.remove(s.mesh));soldiers=[];
  notice('Der Krieg ist beendet.');
 }
 ui();
}
function buildHouse(){
 house((Math.random()-.5)*45,(Math.random()-.5)*45);
 addPeople(2);ui();notice('Gebäude errichtet!');
}
function declareWar(){
 if(atWar){notice('Krieg läuft bereits!');return}
 atWar=true;armyCount=30+Math.floor(Math.random()*50);
 for(let i=0;i<12;i++){
  soldier(-10+Math.random()*6,-10+Math.random()*6,kingdomColor);
  soldier(10+Math.random()*6,10+Math.random()*6,0xc94c4c,true);
 }
 notice(kingdom+' zieht in den Krieg!');ui();
}

// CLICK PLANETS
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
renderer.domElement.addEventListener('click',e=>{
 if(view!=='space')return;
 pointer.x=e.clientX/innerWidth*2-1;
 pointer.y=-(e.clientY/innerHeight)*2+1;
 ray.setFromCamera(pointer,camera);
 const hits=ray.intersectObjects(system.children,true);
 if(hits.length){
  let o=hits[0].object;
  while(o&&!o.userData.planet)o=o.parent;
  if(o&&o.userData.planet)changePlanet(o.userData.planet);
 }
});

// INITIALIZATION
makeSystem();
surface.visible=true;
system.visible=false;
resetSurface();
ui();

// ANIMATION
function animate(){
 requestAnimationFrame(animate);
 controls.update();time+=.01;
 people.forEach(p=>{
  p.mesh.position.x+=p.dx;p.mesh.position.z+=p.dz;
  if(Math.abs(p.mesh.position.x)>30)p.dx*=-1;
  if(Math.abs(p.mesh.position.z)>30)p.dz*=-1;
  p.mesh.position.y=h(p.mesh.position.x,p.mesh.position.z);
  p.mesh.rotation.y=Math.atan2(p.dz,p.dx);
 });
 soldiers.forEach(s=>{
  s.mesh.position.x+=s.dx;s.mesh.position.z+=s.dz;
  s.mesh.position.y=h(s.mesh.position.x,s.mesh.position.z);
  s.mesh.rotation.y=Math.atan2(s.dz,s.dx);
 });
 if(view==='space')Object.values(planets).forEach(p=>p.rotation.y+=.001);
 renderer.render(scene,camera);
}
animate();

window.advanceYears=advanceYears;
window.buildHouse=buildHouse;
window.declareWar=declareWar;
window.showSpace=showSpace;
window.showSurface=showSurface;
window.changePlanet=changePlanet;

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
